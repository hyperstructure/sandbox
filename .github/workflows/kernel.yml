# Builds the kernel that fctl's firecracker driver boots its sandboxes with,
# for amd64 and arm64, boots it in Firecracker where the runner has KVM, and
# publishes it as ghcr.io/hyperstructure/sandbox-kernel:<Linux version> and
# :<major>.<minor>: an image whose /vmlinux is the kernel. fctl pins the
# version its hosts pull.
#
# - A push to main that changes kernel/ builds and publishes the version in
#   kernel/VERSION, unless it is published already from that change or a
#   later one.
# - `gh workflow run kernel.yml` does the same; `-f force=true` builds even
#   when it is current.
# - Pull requests that change kernel/ build and check it without publishing.
#
# Each architecture builds on its own runner and is pushed by digest, without
# a tag; the last job tags the two as one image. Only main publishes.
name: Kernel

on:
  pull_request:
    paths:
      - kernel/**
      - .github/workflows/kernel.yml
  push:
    branches: [main]
    paths:
      - kernel/**
      - .github/workflows/kernel.yml
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the published kernel is current
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/hyperstructure/sandbox-kernel
  DESCRIPTION: The kernel of fctl's Firecracker sandboxes
  SOURCE: https://github.com/hyperstructure/sandbox

jobs:
  plan:
    name: What to build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tags: ${{ steps.plan.outputs.tags }}
      created: ${{ steps.plan.outputs.created }}
      build: ${{ steps.plan.outputs.build }}
      push: ${{ steps.plan.outputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Version and tags
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force && 'yes' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < kernel/VERSION)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::kernel/VERSION says '$version'"; exit 1; }
          IFS=. read -r major minor _ <<<"$version"
          tags="$IMAGE:$version $IMAGE:$major.$minor"

          # Only main publishes; pull requests and other branches build and check.
          push=no
          if [ "$EVENT" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then push=yes; fi

          build=yes why="it was started with force=true"
          if [ "$push" = yes ] && [ -z "$FORCE" ]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
            if index=$(docker buildx imagetools inspect --raw "$IMAGE:$version" 2>/dev/null); then
              revision=$(jq -r '.annotations["org.opencontainers.image.revision"] // ""' <<<"$index")
              # Current when built from the last commit that changed it, or a later one.
              changed=$(git log -1 --format=%H -- kernel .github/workflows/kernel.yml)
              if git merge-base --is-ancestor "$changed" "$revision" 2>/dev/null; then
                build=no why="$IMAGE:$version is current (built from ${revision:0:7})"
              else
                why="$IMAGE:$version predates $(git log -1 --format='%h ("%s")' "$changed")"
              fi
            else
              why="$IMAGE:$version isn't published yet"
            fi
          fi

          {
            echo "version=$version"
            echo "tags=$tags"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "build=$build"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"
          {
            if [ "$build" = no ]; then
              echo "Nothing to build: $why."
            elif [ "$push" = yes ]; then
              echo "Building Linux $version for \`$tags\`: $why."
            else
              echo "Building Linux $version from \`$GITHUB_REF\`, without publishing it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.build == 'yes'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CREATED: ${{ needs.plan.outputs.created }}
      PUSH: ${{ needs.plan.outputs.push }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          docker buildx create --name kernel --driver docker-container --use >/dev/null
          docker buildx build kernel \
            --platform "linux/$ARCH" --pull --provenance=false \
            --output "type=local,dest=$RUNNER_TEMP/out"
          ls -l "$RUNNER_TEMP/out"
      - name: Boot it
        run: |
          # GitHub's x86_64 runners have KVM, for root only.
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          sudo apt-get install -y --no-install-recommends busybox-static >/dev/null
          kernel/check.sh "$RUNNER_TEMP/out/vmlinux" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push it by digest
        id: push
        if: needs.plan.outputs.push == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          # The same build again, from the builder's cache.
          docker buildx build kernel \
            --platform "linux/$ARCH" --provenance=false \
            --label "org.opencontainers.image.title=sandbox-kernel" \
            --label "org.opencontainers.image.description=$DESCRIPTION" \
            --label "org.opencontainers.image.url=$SOURCE" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.licenses=GPL-2.0-only" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$CREATED" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true" \
            --metadata-file "$RUNNER_TEMP/build.json"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - if: needs.plan.outputs.push == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: [plan, build]
    if: needs.plan.outputs.push == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CREATED: ${{ needs.plan.outputs.created }}
      TAGS: ${{ needs.plan.outputs.tags }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kernel-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Tag both architectures as one image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          sources=()
          for file in "$RUNNER_TEMP"/digests/*; do sources+=("$IMAGE@sha256:$(basename "$file")"); done
          [ "${#sources[@]}" = 2 ] || { echo "::error::expected a digest for each architecture, got ${sources[*]}"; exit 1; }
          tags=()
          for tag in $TAGS; do tags+=(--tag "$tag"); done
          # On the index too: GHCR shows these, and the next runs read the
          # commit from them.
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.licenses=GPL-2.0-only" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          {
            echo "Published Linux $VERSION as:"
            for tag in $TAGS; do echo "- \`$tag\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

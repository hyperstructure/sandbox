# ShellCheck for the scripts, actionlint (with ShellCheck) for the workflows,
# and that the Dockerfile runs every step of provision.sh.
name: Lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck and actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: shellcheck --version && shellcheck provision.sh check.sh check-fctl.sh examples/check.sh kernel/build.sh kernel/check.sh
      - name: The Dockerfile runs every step
        run: |
          # Each in a RUN of its own, in the order of provision.sh's STEPS: a
          # step left out would be missing from the image, though fctl's
          # Lima driver, which runs them all, would have it.
          steps=$(sed -n '/^STEPS=(/,/^)/{/^STEPS=(/d;/^)/d;p}' provision.sh | xargs)
          runs=$(sed -n 's|^RUN bash /tmp/provision.sh \([a-z-]*\).*|\1|p' Dockerfile | xargs)
          if [ -z "$steps" ] || [ "$steps" != "$runs" ]; then
            echo "::error file=Dockerfile::The Dockerfile runs the steps '$runs', but provision.sh's STEPS are '$steps'"
            exit 1
          fi
          echo "The Dockerfile runs every step: $steps"
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

# Keeps the workflows' actions current: one pull request a month for all of
# them, titled as a Conventional Commit (ci(deps): …).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
